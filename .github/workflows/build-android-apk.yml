 .github/workflows/build-android-apk.yml
name: Build Aldo Animate APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -o Aldo-Animate-Android-Build-Ready.zip

      - name: Build APK
        run: gradle -p aldo-animate-build/android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Aldo-Animate-APK
          path: aldo-animate-build/android/app/build/outputs/apk/debug/app-debug.apk
